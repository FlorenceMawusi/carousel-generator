name: Post Carousel

on:
  schedule:
    - cron: '0 18 * * 1,3,5'  # Mon/Wed/Fri 11am Arizona time (UTC-7)
  workflow_dispatch:            # allow manual trigger from GitHub UI

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout carousel-generator
        uses: actions/checkout@v4

      - name: Checkout carousel-assets
        uses: actions/checkout@v4
        with:
          repository: FlorenceMawusi/carousel-assets
          path: carousel-assets-repo
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for image push
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "carousel-bot"

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python run_pipeline.py

      - name: Commit updated posted.json
        run: |
          git config user.email "actions@github.com"
          git config user.name "carousel-bot"
          git add posted.json
          git diff --staged --quiet || git commit -m "update posted.json"
          git push
